name: AWS Isolated Runner Smoke

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-isolated-smoke-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-github-delivery:
    name: Verify GitHub delivery on isolated AWS runner
    runs-on: [self-hosted, Linux, X64, aws, isolated]
    timeout-minutes: 10

    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify runner and revision integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test -n "$RUNNER_NAME"
          test -f "$GITHUB_EVENT_PATH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show --check --format= HEAD
          git fsck --no-dangling
          printf 'repository=%s\nrevision=%s\nrunner=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$RUNNER_NAME"
